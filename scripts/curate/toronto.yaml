# Curation for the Toronto deck. Run `npm run build:deck` to regenerate
# data/decks/toronto.json from OpenStreetMap via Overpass.

city: Toronto, Ontario, Canada
name: Toronto
version: 1

endpoints:
  - https://overpass-api.de/api/interpreter
  - https://overpass.kumi.systems/api/interpreter

# City of Toronto administrative boundary (OSM relation 324211; area = 3600000000 + id).
# Queries are scoped to this area so neighbouring municipalities are excluded.
area: 3600324211

# minLng, minLat, maxLng, maxLat — used only if `area` is omitted.
bbox: [-79.68, 43.55, -79.08, 43.9]

precision: 6
# Douglas-Peucker tolerance in metres.
simplifyToleranceM: 25

categories:
  road:
    query: |
      way[highway~"^(motorway|trunk|primary|secondary)$"][name](${scope});
    # Ways sharing a name are stitched into the longest continuous run so a
    # street is one feature rather than many fragments.
    merge: longest-line
    # Fold "Bloor Street West" and "Bloor Street East" into one street.
    stripDirectional: true
    minLengthM: 1500
    max: 60

  neighbourhood:
    query: |
      node[place~"^(suburb|neighbourhood|quarter)$"][name](${scope});
    merge: first-with-wikidata
    max: 80

  water:
    query: |
      way[waterway~"^(river|canal|stream)$"][name](${scope});
      way[natural~"^(water|bay)$"][name](${scope});
    merge: largest-area
    max: 30

  landmark:
    query: |
      node[tourism~"^(attraction|museum|gallery|viewpoint|aquarium|zoo|theme_park)$"][name](${scope});
      way[tourism~"^(attraction|museum|gallery|viewpoint|aquarium|zoo|theme_park)$"][name](${scope});
      node[leisure=stadium][name](${scope});
      way[leisure=stadium][name](${scope});
      node[man_made~"^(tower|water_tower)$"][name](${scope});
      way[man_made=tower][name](${scope});
      node[amenity=marketplace][name](${scope});
      way[amenity=marketplace][name](${scope});
      node[historic~"^(castle|monument|memorial)$"][name](${scope});
      way[historic~"^(castle|monument|memorial)$"][name](${scope});
    merge: largest-area
    max: 80

exclude:
  road:
    - Ramp
    - Highway 401 Collector
    - Highway 401 Express
    - Highway 427 Collector
    - Highway 427 Express
  neighbourhood: []
  water:
    - Taylor-Massey Creek
    - Princess Margaret Fountain
  landmark:
    - CN Tower Edge Walk

# Names that must appear in the deck even if they fall outside the automatic
# size limits above. Missing names are reported as warnings.
include:
  road:
    - Yonge Street
    - Bloor Street
    - Queen Street
    - King Street
    - Dundas Street
    - Spadina Avenue
    - Bathurst Street
    - Eglinton Avenue
    - Danforth Avenue
    - St. Clair Avenue
    - Lake Shore Boulevard
    - Gardiner Expressway
    - Don Valley Parkway
    - Highway 401
    - Highway 427
  neighbourhood:
    - Kensington Market
    - Liberty Village
    - Chinatown
    - The Beaches
    - Yorkville
    - Parkdale
    - Leslieville
    - Roncesvalles
    - Little Italy
  water:
    - Humber River
    - Don River
  landmark:
    - CN Tower
    - Royal Ontario Museum
    - Casa Loma
    - Art Gallery of Ontario
    - St. Lawrence Market South
    - Distillery District
    - Fort York
    - Nathan Phillips Square
    - Rogers Centre
    - Scotiabank Arena
    - Hockey Hall of Fame
    - Ripley's Aquarium of Canada

# Entries with geometry are added as standalone features. Entries without
# geometry patch the matching generated feature (by name) with a description,
# aliases or a custom tolerance.
manual:
  - name: Lake Ontario
    id: osm:relation/lake-ontario
    category: water
    noun: lake
    description: The Great Lake forming Toronto's southern waterfront; the city's harbour is sheltered behind the Toronto Islands.
    geometry:
      type: Polygon
      coordinates:
        - - [-79.63, 43.63]
          - [-79.2, 43.63]
          - [-79.2, 43.55]
          - [-79.63, 43.55]
          - [-79.63, 43.63]

  - name: CN Tower
    category: landmark
    aliases: [The CN Tower]
    toleranceM: 150
    description: A 553 m concrete communications and observation tower on the downtown waterfront and a symbol of the city.

  - name: Royal Ontario Museum
    category: landmark
    aliases: [ROM]
    description: Canada's largest museum of art, culture and natural history, marked by the angular glass Crystal addition on Bloor Street.

  - name: Casa Loma
    category: landmark
    description: A Gothic Revival mansion built for financier Sir Henry Pellatt, now a museum and event venue on a hill north of downtown.

  - name: Art Gallery of Ontario
    category: landmark
    aliases: [AGO]
    description: A major art museum in Grange Park whose Frank Gehry-designed facade faces Dundas Street.

  - name: St. Lawrence Market South
    category: landmark
    aliases: [St. Lawrence Market]
    description: A historic public market in the Old Town area, with the South Market dating to 1845.

  - name: Union Station
    id: osm:way/14744491
    category: landmark
    noun: train station
    aliases: [Toronto Union Station]
    toleranceM: 120
    description: The city's grand Beaux-Arts railway station and the centre of the GO, VIA and subway networks.
    geometry:
      type: Point
      coordinates: [-79.380375, 43.644716]

  - name: Distillery District
    category: neighbourhood
    description: A pedestrian-only heritage district of Victorian industrial buildings east of downtown, now galleries, shops and restaurants.

  - name: Kensington Market
    category: neighbourhood
    description: A bohemian downtown neighbourhood of narrow streets, vintage shops and food markets, west of Spadina Avenue.

  - name: Liberty Village
    category: neighbourhood
    description: A former industrial area in the west end converted into a dense residential and tech-office neighbourhood.

  - name: Yonge Street
    category: road
    aliases: [Yonge]
    description: The city's main north-south spine and the traditional dividing line between east and west street numbering.

  - name: Bloor Street
    category: road
    description: A major east-west street just north of downtown, home to the Mink Mile shopping district.

  - name: Highway 401
    category: road
    aliases: ["401", The 401, King's Highway 401, Macdonald-Cartier Freeway]
    description: The main east-west freeway across the top of the city, one of the busiest highways in North America.

  - name: Humber River
    category: water
    description: A river flowing south through the city's west end into Lake Ontario, flanked by the Humber River recreational trail.

  - name: Don River
    category: water
    aliases: [The Don]
    description: A river crossing the city's east end, meeting the harbour at the Don River mouth near the Port Lands.
